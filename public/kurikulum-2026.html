<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dokumen Kurikulum 2026</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f4f6f8;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    background: #1a73e8;
    color: white;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    font-weight: 600;
  }
  header p {
    margin: 4px 0 0;
    font-size: 13px;
    opacity: 0.85;
  }
  .btn {
    background: white;
    color: #1a73e8;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }
  .btn:hover {
    background: #e8f0fe;
  }
  .frame-wrap {
    flex: 1;
    padding: 16px;
  }
  iframe {
    width: 100%;
    height: 100%;
    min-height: 75vh;
    border: 1px solid #dadce0;
    border-radius: 8px;
    background: white;
  }
  footer {
    text-align: center;
    font-size: 12px;
    color: #888;
    padding: 12px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>📄 Dokumen Kurikulum 2026</h1>
    <p>Daftar tautan file — klik langsung di dalam tabel untuk membuka file Google Drive</p>
  </div>
  <a class="btn" href="https://docs.google.com/spreadsheets/d/1azfyonauW92ovB_O_Xp_hK4SHyEP_Ds1rJWlseZYfjU/edit?usp=sharing" target="_blank" rel="noopener">Buka di Google Sheets ↗</a>
</header>

<div class="frame-wrap">
  <iframe
    src="https://docs.google.com/spreadsheets/d/1azfyonauW92ovB_O_Xp_hK4SHyEP_Ds1rJWlseZYfjU/preview"
    allowfullscreen>
  </iframe>
</div>

<footer>Biro Mindset · Unit Layanan Psikologi Mindset School</footer>

</body>
</html>
